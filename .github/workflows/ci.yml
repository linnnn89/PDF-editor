name: Windows build and package verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned native dependencies
        run: npm run setup
      - name: Build native engine
        run: npm run build
      - name: Check loaded runtime
        run: node src/cli.mjs doctor --deep
      - name: Run synthetic workflow tests
        run: npm test
      - name: Package and verify relocated runtime
        run: npm run skill:pack
